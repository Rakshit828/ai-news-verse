
services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_news
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    image: ai-news-backend:latest
    container_name: api
    working_dir: /contenerization
    command: bash -c "alembic upgrade head && fastapi run src"
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_news
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery_worker:
    image: ai-news-backend:latest
    container_name: celery_worker
    working_dir: /contenerization
    command: celery -A src.worker.celery_app worker --loglevel=info --concurrency=5 --events
    env_file:
      - ./.env
    environment:
      # Used redis_url so that the tasks created can connect to the container redis.
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/ai_news
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery_beat:
    image: ai-news-backend:latest
    container_name: celery_beat
    working_dir: /contenerization
    command: celery -A src.worker.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./.env
    environment:
      # Used redis_url so that the tasks created can connect to the container redis.
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/ai_news
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: