version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    working_dir: /contenerization
    command: celery -A app.background_tasks.celery_app worker --loglevel=info --concurrency=2 --events
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/contenerization:rw
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    working_dir: /contenerization
    command: celery -A app.background_tasks.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/contenerization:rw
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
    name: redis-data
